[project]
name = "daily-money-tracker-backend"
version = "0.1.0"
description = "Daily Money Tracker - FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.40",
    "alembic>=1.15.0",
    "apscheduler>=3.11.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.9.0",
    "pywebpush>=2.0.0",
    "python-jose[cryptography]>=3.4.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "cryptography>=45.0.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.131.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
